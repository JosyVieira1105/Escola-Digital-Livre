
<!DOCTYPE html>
<!-- Declara que este documento usa HTML5 -->

<html lang="pt-BR">
<!-- Elemento raiz da página e definição do idioma -->

<head>
    <!-- Informações de configuração do site -->

    <meta charset="UTF-8">
    <!-- Garante a exibição correta dos acentos -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Permite a adaptação em dispositivos móveis -->

    <title>VIPCELL - Distribuidora</title>
    <!-- Título exibido na aba do navegador -->

    <link rel="stylesheet" href="style.css">
    <!-- Conecta o arquivo CSS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <!-- Importa a fonte Inter -->

</head>

<body>
    <!-- Conteúdo visível do site -->

    <header class="header">
        <!-- Tag semântica que representa o cabeçalho -->

        <div class="header-container">
            <!-- Container que organiza os elementos do cabeçalho -->

            <a href="index.html" class="logo">
                <!-- Logo clicável que leva à página inicial -->

                <img src="./assets/Logo VIPCELL com ícone de smartphone.png"
                     alt="Logo da Distribuidora VIPCELL">
                <!-- Imagem da logo da empresa -->

                <span class="logo-text">
                    <!-- Nome e descrição da empresa -->

                    <span class="logo-subtitle">
                
                    </span>

                </span>
            </a>

            <nav class="main-nav" id="menu-principal">
                <!-- Menu de navegação -->

                <a href="index.html"
                   class="nav-link active"
                   aria-current="page">Início</a>

                <a href="#produtos" class="nav-link">Produtos</a>

                <a href="#sobre" class="nav-link">Sobre</a>

                <a href="#contato" class="nav-link">Contato</a>

            </nav>

            <div class="header-actions">
                <!-- Agrupa a busca e o botão de ação -->

                <button class="hamburguer"
                        id="btn-menu"
                        type="button"
                        aria-label="Abrir menu"
                        aria-expanded="false"
                        aria-controls="menu-principal">
                    ☰
                </button>
                <!-- Botão de menu para telas pequenas -->

                <div class="search-box">
                    <!-- Campo de busca -->


                    <div class="search-field">

                        <input
                            type="text"
                            id="pesquisa"
                            placeholder="Buscar produtos..."
                        >
                        <!-- Campo onde o usuário digita -->

                        <!-- Ícone de lupa em SVG -->
                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="25"
                             height="25"
                             viewBox="0 0 32 32"
                             aria-hidden="true">

                            <circle cx="14" cy="14" r="10"
                                    fill="#d9f5ff"
                                    stroke="#b5b6bf"
                                    stroke-width="2"></circle>

                            <path d="M21 21 L28 28"
                                  fill="none"
                                  stroke="#777777"
                                  stroke-width="3"
                                  stroke-linecap="round"></path>

                        </svg>

                    </div>
                </div>

                <a href="#" class="cta-button">
                    Comprar agora
                </a>
                <!-- Botão de chamada para ação -->

            </div>
        </div>
    </header>

    <!-- O conteúdo abaixo do cabeçalho foi removido -->

    <script src="script.js"></script>
    <!-- Conecta o JavaScript do menu -->

</body>
</html>
